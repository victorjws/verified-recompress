[package]
name = "storage-optimizer"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "signal", "time", "io-util"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["json"], default-features = false }
num_cpus = "1.17.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
dirs = "7.0.0"
fs4 = "1.1.0"
globset = "0.4.20"
rusqlite = { version = "0.40.2", features = ["bundled"] }
blake3 = "1.8.7"
sha2 = "0.11.0"
hex = "0.4.3"
anyhow = "1.0.104"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
indicatif = "0.18.6"
humansize = "2.1.3"
tempfile = "3.27.0"

[dev-dependencies]
tempfile = "3.27.0"
