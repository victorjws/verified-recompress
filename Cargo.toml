[package]
name = "verified-recompress"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "signal", "time", "io-util"] }
tokio-util = { version = "0", features = ["rt"] }
futures = "0"
reqwest = { version = "0", features = ["json"], default-features = false }
num_cpus = "1"
rand = "0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "7"
fs4 = "1"
globset = "0"
rusqlite = { version = "0", features = ["bundled"] }
blake3 = "1"
sha2 = "0"
hex = "0"
anyhow = "1"
thiserror = "2"
tracing = "0"
tracing-subscriber = { version = "0", features = ["env-filter"] }
indicatif = "0"
humansize = "2"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
